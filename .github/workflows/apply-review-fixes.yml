name: Apply confirmed review fixes

on:
  push:
    branches:
      - fix/v1.0.2-review-regressions

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Bootstrap confirmed review fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.0.2-review-regressions

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply source and regression-test fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          userscript_path = Path('gofile-abdm.user.js')
          source = userscript_path.read_text(encoding='utf-8')

          old = "        timeout,\n"
          new = "        ...(timeout > 0 ? { timeout } : {}),\n"
          assert source.count(old) == 1, source.count(old)
          source = source.replace(old, new, 1)

          old = "      }, 180000);\n"
          new = "      }, 0);\n"
          assert source.count(old) == 1, source.count(old)
          source = source.replace(old, new, 1)

          old = "    } finally {\n      state.resolving = false;\n      updateToolbar();\n    }\n  }\n\n  function discoverVisibleDomItems()"
          new = "    } finally {\n      state.resolving = false;\n      if (!state.root) injectCheckboxes();\n      updateToolbar();\n    }\n  }\n\n  function discoverVisibleDomItems()"
          assert source.count(old) == 1, source.count(old)
          source = source.replace(old, new, 1)
          userscript_path.write_text(source, encoding='utf-8')

          tests_path = Path('tests/test_core.py')
          tests = tests_path.read_text(encoding='utf-8')

          old = '''        self.assertAlmostEqual(sleep_mock.call_args.args[0], 0.55, places=2)\n\n\nclass HelperRateLimitStaticTests(unittest.TestCase):'''
          new = '''        self.assertAlmostEqual(sleep_mock.call_args.args[0], 0.55, places=2)\n\n    def test_242_content_requests_accumulate_180_75_seconds_of_pacing(self):\n        client = GoFileClient(session=Mock())\n        client.request_interval = 0.75\n        now = [100.0]\n\n        def monotonic():\n            return now[0]\n\n        def sleep(seconds):\n            now[0] += seconds\n\n        with patch("gofile.time.monotonic", side_effect=monotonic), \\\n             patch("gofile.time.sleep", side_effect=sleep):\n            for _ in range(242):\n                client._pace_content_request()\n\n        self.assertAlmostEqual(now[0] - 100.0, 180.75, places=6)\n\n\nclass HelperRateLimitStaticTests(unittest.TestCase):'''
          assert tests.count(old) == 1, tests.count(old)
          tests = tests.replace(old, new, 1)

          old = '''    def test_selection_works_before_helper_resolve(self):\n        self.assertIn("provisionalSelectedIds", self.source)\n        self.assertIn("discoverVisibleDomItems", self.source)\n        self.assertIn("checkbox.dataset.gabContentId", self.source)\n        self.assertIn("await resolveContent(true)", self.source)\n\n\n@unittest.skipIf(app is None, 'Flask is not installed in this execution environment')'''
          new = '''    def test_selection_works_before_helper_resolve(self):\n        self.assertIn("provisionalSelectedIds", self.source)\n        self.assertIn("discoverVisibleDomItems", self.source)\n        self.assertIn("checkbox.dataset.gabContentId", self.source)\n        self.assertIn("await resolveContent(true)", self.source)\n\n    def test_resolve_failure_restores_provisional_checkboxes(self):\n        start = self.source.index("  async function resolveContent(")\n        end = self.source.index("  function discoverVisibleDomItems()", start)\n        resolve_block = self.source[start:end]\n        self.assertIn("if (!state.root) injectCheckboxes();", resolve_block)\n\n    def test_recursive_resolve_has_no_userscript_deadline(self):\n        start = self.source.index("  async function resolveContent(")\n        end = self.source.index("  function discoverVisibleDomItems()", start)\n        resolve_block = self.source[start:end]\n        self.assertIn("}, 0);", resolve_block)\n        self.assertNotIn("180000", resolve_block)\n        self.assertIn("...(timeout > 0 ? { timeout } : {}),", self.source)\n\n\n@unittest.skipIf(app is None, 'Flask is not installed in this execution environment')'''
          assert tests.count(old) == 1, tests.count(old)
          tests = tests.replace(old, new, 1)
          tests_path.write_text(tests, encoding='utf-8')
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python regression tests
        run: python -m unittest discover -s tests -v

      - name: Check Userscript syntax
        run: node --check gofile-abdm.user.js

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gofile-abdm.user.js tests/test_core.py
          git commit -m "Apply confirmed review fixes"
          git push origin HEAD:fix/v1.0.2-review-regressions
