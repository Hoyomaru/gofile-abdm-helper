name: Apply v1.0.3 metadata

on:
  push:
    branches:
      - fix/v1.0.2-review-regressions

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Bootstrap v1.0.3 metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.0.2-review-regressions

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update release metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          userscript = Path('gofile-abdm.user.js')
          source = userscript.read_text(encoding='utf-8')
          old = '// @version      1.0.2\n'
          new = '// @version      1.0.3\n'
          assert source.count(old) == 1, source.count(old)
          userscript.write_text(source.replace(old, new, 1), encoding='utf-8')

          version = Path('VERSION')
          assert version.read_text(encoding='utf-8') == '1.0.2\n'
          version.write_text('1.0.3\n', encoding='utf-8')

          readme = Path('README.md')
          source = readme.read_text(encoding='utf-8')
          old = '**Stable release:** `v1.0.2`\n'
          new = '**Stable release:** `v1.0.3`\n'
          assert source.count(old) == 1, source.count(old)
          readme.write_text(source.replace(old, new, 1), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          source = changelog.read_text(encoding='utf-8')
          marker = '## [1.0.2] - 2026-09-06\n'
          entry = '''## [1.0.3] - 2026-09-08\n\nReview regression fixes.\n\n### Fixed\n\n- Restore provisional row checkboxes when GoFile resolve fails, including cases where the page DOM does not change afterward.\n- Remove the fixed 180-second Userscript deadline from recursive resolve requests while retaining the Helper's per-request GoFile API timeouts.\n- Add regression coverage for 242 paced content requests (180.75 seconds), failed-resolve checkbox restoration, and recursive resolve without a Userscript deadline.\n\n'''
          assert source.count(marker) == 1, source.count(marker)
          changelog.write_text(source.replace(marker, entry + marker, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check Userscript syntax
        run: node --check gofile-abdm.user.js

      - name: Commit metadata
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gofile-abdm.user.js VERSION README.md CHANGELOG.md
          git commit -m "Prepare v1.0.3 review fixes"
          git push origin HEAD:fix/v1.0.2-review-regressions
