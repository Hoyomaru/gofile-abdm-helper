name: Publish Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: "${{ startsWith(github.event.head_commit.message, 'release: publish v') }}"
    runs-on: ubuntu-latest
    outputs:
      version: "${{ steps.version.outputs.version }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          SCRIPT_VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          s=Path('gofile-abdm.user.js').read_text(encoding='utf-8')
          m=re.search(r'^// @version\s+([^\s]+)\s*$',s,re.M)
          if not m: raise SystemExit('userscript @version missing')
          print(m.group(1))
          PY
          )"
          test "$VERSION" = "$SCRIPT_VERSION"
          test "${{ github.event.head_commit.message }}" = "release: publish v$VERSION"
          test -f "docs/releases/v$VERSION.md"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Record resolved Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT="python-dependencies-v${{ steps.version.outputs.version }}.txt"
          {
            echo "# $(python --version 2>&1)"
            echo "# $(python -m pip --version)"
            python -m pip freeze --all | sort
          } > "$SNAPSHOT"
          cat "$SNAPSHOT"
      - name: Upload dependency snapshot
        uses: actions/upload-artifact@v4
        with:
          name: python-dependencies-v${{ steps.version.outputs.version }}
          path: python-dependencies-v${{ steps.version.outputs.version }}.txt
          if-no-files-found: error
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m py_compile app.py gofile.py abdm.py tray.py
      - name: Run Userscript tests
        run: node --test tests/*.cjs
      - name: Check Userscript syntax
        run: node --check gofile-abdm.user.js

  windows-setup:
    if: "${{ startsWith(github.event.head_commit.message, 'release: publish v') }}"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run one-step setup without launching tray
        shell: powershell
        run: .\setup-windows.ps1 -NoLaunch
      - name: Verify local venv and imports
        shell: powershell
        run: |
          if (-not (Test-Path '.\.venv\Scripts\python.exe')) { throw 'Local venv python missing.' }
          if (-not (Test-Path '.\.venv\Scripts\pythonw.exe')) { throw 'Local venv pythonw missing.' }
          .\.venv\Scripts\python.exe -c "import flask, requests, pystray, PIL; print('Windows setup smoke: OK')"
      - name: Verify setup is idempotent
        shell: powershell
        run: .\setup-windows.ps1 -NoLaunch

  publish:
    if: "${{ startsWith(github.event.head_commit.message, 'release: publish v') }}"
    needs: [validate, windows-setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download dependency snapshot
        uses: actions/download-artifact@v4
        with:
          name: python-dependencies-v${{ needs.validate.outputs.version }}
          path: release-assets
      - name: Create or verify tag
        env:
          VERSION: "${{ needs.validate.outputs.version }}"
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk '{print $1}')"
          if [ -z "$REMOTE_SHA" ]; then REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"; fi
          if [ -n "$REMOTE_SHA" ]; then
            test "$REMOTE_SHA" = "$GITHUB_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "GoFile ABDM Helper $TAG"
            git push origin "$TAG"
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: "${{ github.token }}"
          VERSION: "${{ needs.validate.outputs.version }}"
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping existing release."
          else
            gh release create "$TAG" --verify-tag --title "GoFile ABDM Helper $TAG" --notes-file "docs/releases/$TAG.md"
          fi
          gh release upload "$TAG" "release-assets/python-dependencies-v$VERSION.txt" --clobber
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,url
